<!DOCTYPE html>
<!-- ============================================================
     页面：后台用户管理（管理员专用）
     以表格形式展示所有注册用户及其信息（ID、用户名、昵称、
     邮箱、角色、启用状态、创建时间）。
     管理员可切换用户的启用/禁用状态。
     非管理员访问会被拦截并跳回首页。
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

    <div class="container-fluid">
            <div class="container" style="max-width:1200px;">
            <div class="page-header">
                <h1>用户管理</h1>
                <div class="meta">ADMIN / USERS</div>
            </div>

            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>昵称</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <tr id="usersTableSkeleton"><td colspan="8"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line-sm"></div><div style="height:8px;"></div><div class="skeleton skeleton-line"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/admin/users.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
