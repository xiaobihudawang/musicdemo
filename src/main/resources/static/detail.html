<!DOCTYPE html>
<!-- ============================================================
     页面：音乐详情（播放器布局）
     CSS: base + layout + components + player
     容器: .container-fluid（占满全宽，避免被 800px 限制）
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/player.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="/video/logo.png" alt="Loading">
    </div>

    <div class="container-fluid">
        <div id="detailContent">
            <div id="detailSkeleton">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-line-sm"></div>
                <div style="height:20px;"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line-sm"></div>
                <div style="height:16px;"></div>
                <div class="skeleton skeleton-block"></div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/forbidden-words.js"></script>
    <script src="/js/pages/detail.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
