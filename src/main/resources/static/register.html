<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <h2>注册</h2>
        <div class="card">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码 *（6-18 位）</label>
                <input type="password" id="password" placeholder="请输入密码（6-18 位）">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="name" placeholder="可选，不填则使用用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="可选">
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="doRegister()">注册</button>
                <a href="/login.html">已有账号？去登录</a>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/register.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
