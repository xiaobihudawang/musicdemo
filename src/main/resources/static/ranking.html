<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1>排行榜</h1>
            <div class="meta">本周热门排行</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('likes', this)">♥ 点赞排行</button>
            <button class="tab-btn" onclick="switchTab('downloads', this)">⬇ 下载排行</button>
            <button class="tab-btn" onclick="switchTab('comments', this)">💬 评论排行</button>
        </div>

        <div class="card">
            <div id="rankList">
                <div id="rankSkeleton">
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line-sm"></div>
                    <div style="height:12px;"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line-sm"></div>
                    <div style="height:12px;"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/ranking.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
