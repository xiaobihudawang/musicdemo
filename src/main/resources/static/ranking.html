<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="/video/logo.png" alt="Loading">
    </div>

    <div class="page-header">
        <h1>排行榜</h1>
        <div class="meta">本周热门排行</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('likes', this)">♥ 点赞排行</button>
        <button class="tab-btn" onclick="switchTab('downloads', this)">⬇ 下载排行</button>
        <button class="tab-btn" onclick="switchTab('comments', this)">💬 评论排行</button>
    </div>

    <div class="card">
        <div id="rankList">
            <div id="rankSkeleton">
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line-sm"></div>
                <div style="height:12px;"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line-sm"></div>
                <div style="height:12px;"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line-sm"></div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        let currentType = 'likes';

        function switchTab(type, btn) {
            currentType = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadRanking();
        }

        async function loadRanking() {
            const res = await get('/api/ranking/' + currentType);
            if (res.code !== 200) return;
            document.getElementById('rankSkeleton').classList.add('hidden');
            const list = res.data;
            if (!list || list.length === 0) {
                document.getElementById('rankList').innerHTML = '<div class="tip">本周暂无排行数据</div>';
                return;
            }
            document.getElementById('rankList').innerHTML = list.map((item, index) => {
                const rankClass = index < 3 ? 'top3' : '';
                return `
                    <div class="rank-item ${rankClass}">
                        <div class="rank-num">${index + 1}</div>
                        <div style="flex:1;">
                            <div><a href="/detail.html?id=${item.id}"><strong style="font-family:'Syne',sans-serif;">${escapeHtml(item.title)}</strong></a></div>
                            <div style="color:var(--text-muted);font-size:13px;font-style:italic;">
                                ${escapeHtml(item.artist)} &mdash;
                                ♥ ${item.likeCount} &nbsp;💬 ${item.commentCount} &nbsp;⬇ ${item.downloadCount}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadRanking();
    </script>
</body>
</html>
