<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="/video/logo.png" alt="Loading">
    </div>

    <div id="detailContent">
        <div id="detailSkeleton">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-line-sm"></div>
            <div style="height:20px;"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line-sm"></div>
            <div style="height:16px;"></div>
            <div class="skeleton skeleton-block"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const musicId = urlParams.get('id');
        let musicData = null;
        let liked = false;

        async function loadDetail() {
            if (!musicId) { document.getElementById('detailContent').innerHTML = '<div class="tip">未找到音乐</div>'; return; }
            const res = await get('/api/music/' + musicId);
            if (res.code !== 200) { document.getElementById('detailContent').innerHTML = '<div class="tip">音乐不存在</div>'; return; }
            document.getElementById('detailSkeleton').classList.add('hidden');
            musicData = res.data.music;
            const comments = res.data.comments || [];
            renderDetail(musicData, comments);
            if (isLogined()) checkLikeStatus();
        }

        async function checkLikeStatus() {
            const res = await get('/api/music/' + musicId + '/like/status');
            if (res.code === 200) { liked = res.data.liked; updateLikeButton(); }
        }

        function updateLikeButton() {
            const btn = document.getElementById('likeBtn');
            if (!btn) return;
            btn.textContent = liked ? '♥ 已赞' : '♡ 点赞';
            btn.className = liked ? 'btn btn-danger btn-sm' : 'btn btn-default btn-sm';
        }

        function renderDetail(music, comments) {
            const container = document.getElementById('detailContent');
            const coverUrl = music.coverPath ? `/api/music/cover/${music.coverPath}` : null;

            let html = `
                <div class="detail-header">
                    <h1>${escapeHtml(music.title)}</h1>
                    <div class="meta">${escapeHtml(music.artist)} &mdash; 上传者 ${escapeHtml(music.username)} &mdash; ${formatDate(music.createTime)}</div>
                </div>

                <div class="detail-player">
                    ${coverUrl ? `<img src="${coverUrl}" alt="${escapeHtml(music.title)}" class="detail-cover">` : ''}
                    <div class="detail-desc">${escapeHtml(music.description || '暂无简介')}</div>
                    <audio controls>
                        <source src="/api/music/${music.id}/stream">
                    </audio>
                    <div class="detail-actions">
                        <button id="likeBtn" class="btn btn-default btn-sm" onclick="toggleLike()">♡ 点赞</button>
                        <span style="color:var(--text-dim);font-size:13px;">♥ ${music.likeCount || 0} &nbsp;💬 ${music.commentCount || 0} &nbsp;⬇ ${music.downloadCount || 0}</span>
                        <button class="btn btn-primary btn-sm" onclick="downloadMusic(${music.id})">⬇ 下载 (${formatSize(music.fileSize)})</button>
            `;
            const currentUserId = (() => { try { const t = getToken(); return t ? parseInt(parseJwt(t).sub) : null; } catch(e) { return null; } })();
            if (isLogined() && (getUserRole() === 'admin' || currentUserId === music.userId)) {
                html += `<button class="btn btn-danger btn-sm" onclick="deleteMusic()">删除</button>`;
                html += `<button class="btn btn-sm" style="background:var(--accent);color:#fff;border-color:var(--accent);" onclick="document.getElementById('coverInput').click()">🖼 更换封面</button>`;
                html += `<input type="file" id="coverInput" accept="image/*" style="display:none" onchange="uploadCover(this)">`;
            }
            html += `</div></div>`;

            html += `<div class="card"><div class="card-header">评论 (${comments.length})</div>`;
            if (isLogined()) {
                html += `
                    <div class="comment-form">
                        <div class="form-group">
                            <textarea id="commentContent" placeholder="写下你的评论..." rows="3"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
                    </div>
                `;
            }
            if (comments.length === 0) {
                html += '<div class="tip">暂无评论，快来抢沙发吧！</div>';
            } else {
                html += '<ul class="comment-list">';
                comments.forEach(c => {
                    html += `
                        <li class="comment-item">
                            <div><span class="comment-user">${escapeHtml(c.username)}</span><span class="comment-time">${formatDate(c.createTime)}</span></div>
                            <div class="comment-content">${escapeHtml(c.content)}</div>
                            ${getUserRole() === 'admin' ? `<button class="btn btn-danger btn-sm" style="margin-top:4px;" onclick="deleteComment(${c.id})">删除</button>` : ''}
                        </li>
                    `;
                });
                html += '</ul>';
            }
            html += '</div>';
            container.innerHTML = html;
        }

        async function toggleLike() {
            if (!isLogined()) { showToast('请先登录', 'error'); return; }
            const res = await post('/api/music/' + musicId + '/like');
            if (res.code === 200) { liked = res.data.liked; updateLikeButton(); showToast(liked ? '点赞成功' : '已取消点赞', 'success'); loadDetail(); }
            else { showToast(res.message, 'error'); }
        }

        async function submitComment() {
            const content = document.getElementById('commentContent').value.trim();
            if (!content) { showToast('请输入评论内容', 'error'); return; }
            const res = await post('/api/music/' + musicId + '/comments', { content });
            if (res.code === 200) { showToast('评论成功', 'success'); loadDetail(); }
            else { showToast(res.message, 'error'); }
        }

        async function deleteComment(commentId) {
            if (!confirm('确定删除这条评论吗？')) return;
            const res = await del('/api/comments/' + commentId);
            if (res.code === 200) { showToast('删除成功', 'success'); loadDetail(); }
            else { showToast(res.message, 'error'); }
        }

        async function deleteMusic() {
            if (!confirm('确定删除这首音乐吗？删除后不可恢复！')) return;
            const res = await del('/api/music/' + musicId);
            if (res.code === 200) { showToast('删除成功', 'success'); setTimeout(() => { window.location.href = '/'; }, 1000); }
            else { showToast(res.message, 'error'); }
        }

        async function uploadCover(input) {
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            const res = await postForm('/api/admin/music/' + musicId + '/cover', formData);
            if (res.code === 200) { showToast('封面上传成功', 'success'); loadDetail(); }
            else { showToast(res.message, 'error'); }
        }

        async function downloadMusic(id) {
            if (!isLogined()) { showToast('请先登录后再下载', 'error'); return; }
            const token = getToken();
            const response = await fetch('/api/music/' + id + '/download', { headers: { 'Authorization': 'Bearer ' + token } });
            if (!response.ok) {
                const errMsg = response.status === 401 ? '登录已过期，请重新登录' : response.status === 404 ? '文件不存在' : '下载失败(' + response.status + ')';
                showToast(errMsg, 'error'); return;
            }
            try {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = musicData.title + '.' + musicData.filePath.split('.').pop();
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                showToast('下载成功', 'success');
            } catch (e) { showToast('下载文件处理失败', 'error'); }
        }

        loadDetail();
    </script>
</body>
</html>
