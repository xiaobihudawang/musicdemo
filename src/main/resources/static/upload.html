<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传音乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1>上传音乐</h1>
            <div class="meta">UPLOAD</div>
        </div>

        <div class="card" style="max-width:600px;">
            <div class="form-group">
                <label>歌曲标题 *</label>
                <input type="text" id="title" placeholder="请输入歌曲标题">
            </div>
            <div class="form-group">
                <label>歌手 *</label>
                <input type="text" id="artist" placeholder="请输入歌手名">
            </div>
            <div class="form-group">
                <label>简介</label>
                <div style="display:flex;gap:8px;">
                    <textarea id="description" placeholder="这首歌的介绍（可选）" rows="3" style="flex:1;"></textarea>
                    <button class="btn btn-default btn-sm" onclick="generateDescription()" style="white-space:nowrap;align-self:flex-end;" id="aiDescBtn">🤖 AI 生成</button>
                </div>
            </div>
            <div class="form-group">
                <label>音乐文件 *（MP3/FLAC/WAV/AAC/OGG/M4A/MP4，最大 50MB）</label>
                <div class="file-upload" onclick="document.getElementById('file').click()">
                    <input type="file" id="file" accept=".mp3,.flac,.wav,.aac,.ogg,.m4a,.mp4" hidden>
                    <div class="file-upload-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="file-upload-text" id="fileText">点击选择音乐文件</p>
                    <p class="file-upload-hint">MP3 / FLAC / WAV / AAC / OGG / M4A / MP4</p>
                </div>
                <p class="file-info" id="fileInfo"></p>
            </div>
            <button class="btn btn-primary" onclick="doUpload()">上传</button>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/upload.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
