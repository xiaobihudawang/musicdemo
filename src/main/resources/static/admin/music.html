<!DOCTYPE html>
<!-- ============================================================
     页面：后台音乐管理（管理员专用）
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="/video/logo.png" alt="Loading">
    </div>

    <div class="container-fluid">
        <div class="container" style="max-width:1200px;">
            <div class="page-header">
                <h1>音乐管理</h1>
                <div class="meta">ADMIN / MUSIC</div>
            </div>

            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标题</th>
                            <th>歌手</th>
                            <th>上传者</th>
                            <th>点赞</th>
                            <th>评论</th>
                            <th>下载</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="musicTable">
                        <tr id="musicTableSkeleton"><td colspan="9"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line-sm"></div><div style="height:8px;"></div><div class="skeleton skeleton-line"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/admin/music.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
